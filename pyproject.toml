[project]
name = "bgcoach"
version = "0.1.0"
description = "Personal Hearthstone Battlegrounds post-game analysis and skill-improvement loop"
requires-python = ">=3.11"
dependencies = [
    "pillow>=10",
]

[project.scripts]
bgcoach = "bgcoach.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bgcoach"]

[tool.pytest.ini_options]
testpaths = ["tests"]
